name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34 cmdline-tools;latest'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Debug SDK paths
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "---"
          ls -la "$ANDROID_HOME" 2>/dev/null || echo "ANDROID_HOME not found"
          ls -la "$ANDROID_SDK_ROOT" 2>/dev/null || echo "ANDROID_SDK_ROOT not found"
          echo "---"
          which sdkmanager
          sdkmanager --list_installed 2>/dev/null | head -20 || true

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore android.keystore -alias studyapp \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass studypass -keypass studypass \
            -dname "CN=StudyApp, OU=Dev, O=StudyApp, L=BJ, ST=BJ, C=CN"

      - name: Create twa-manifest.json
        run: |
          cat > twa-manifest.json << 'ENDOFFILE'
          {
            "packageId": "com.study.app",
            "host": "xxxl71y.github.io",
            "name": "StudyApp",
            "launcherName": "StudyApp",
            "themeColor": "#6366f1",
            "navigationColor": "#ffffff",
            "navigationColorDark": "#0f172a",
            "backgroundColor": "#ffffff",
            "startUrl": "/study-app/",
            "iconUrl": "https://xxxl71y.github.io/study-app/icon-512.png",
            "maskableIconUrl": "https://xxxl71y.github.io/study-app/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "studyapp"
            },
            "appVersionCode": 1,
            "appVersionName": "1.0",
            "trustedWebActivity": {
              "enabled": true
            }
          }
          ENDOFFILE

      - name: Pre-configure Bubblewrap
        run: |
          SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json << EOF
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$SDK_ROOT"
          }
          EOF
          echo "Bubblewrap config:"
          cat ~/.bubblewrap/config.json
          echo "---"
          echo "SDK root contents:"
          ls "$SDK_ROOT" 2>/dev/null || echo "Cannot list SDK root"

      - name: Init TWA project
        run: yes | bubblewrap init --manifest=twa-manifest.json || true

      - name: Build APK
        run: yes | bubblewrap build --manifest=twa-manifest.json --universalApk --skipPwaValidation
        env:
          STOREPASS: studypass
          KEYPASS: studypass

      - name: Find output files
        if: always()
        run: find . -name "*.apk" -o -name "*.aab" 2>/dev/null | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: study-app-apk
          path: |
            **/*.apk
            **/*.aab
